[project]
name = "qq-notify-forward"
version = "0.1.0"
description = "Forward Linux QQ desktop notifications through Apprise"
requires-python = ">=3.12,<3.13"
# The image installs these from Ubuntu 24.04's apt, not from PyPI; keep the
# pins on the versions apt ships there. dbus-python and PyGObject come from apt
# too and are only needed by the monitor, which the tests don't load.
dependencies = [
    "apprise==1.7.2",
    "requests==2.31.0",
    "markdown==3.5.2",
    "pyyaml==6.0.1",
    "click==8.1.6",
]

[project.scripts]
qq-notify-forward = "qq_notify_forward.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["tests"]
